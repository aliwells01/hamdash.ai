name: POTA Refresh

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

env:
  HAM_API_BASE: https://hamdash-ai.onrender.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pota-refresh
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run SSB Agent (one pass)
        env:
          SPOTS_LIVE_POST_URL: ${{ secrets.SPOTS_LIVE_POST_URL }}
          POTA_ACTIVE_SNAPSHOT_POST_URL: ${{ secrets.POTA_ACTIVE_SNAPSHOT_POST_URL }}
        run: |
          python3 ssb_agent.py --iterations 1

      - name: Fetch active snapshot to file (retry + warmup)
        run: |
          set -euo pipefail

          SNAP_URL="https://hamdash-ai.onrender.com/api/pota/active_snapshot"

          # Warm up Render (ignore failures)
          curl -sS "https://hamdash-ai.onrender.com/" >/dev/null || true
          sleep 2

          # Retry snapshot fetch (handles 503 cold start / transient)
          ok=0
          for i in 1 2 3 4 5; do
            echo "[info] fetch attempt $i..."
            if curl -fsS "$SNAP_URL" -o active_snapshot_raw.json; then
              ok=1
              break
            fi
            echo "[warn] snapshot fetch failed; sleeping..."
            sleep 8
          done

          if [ "$ok" -ne 1 ]; then
            echo "[error] snapshot fetch failed after retries"
            exit 1
          fi

          python3 -c "import json; j=json.load(open('active_snapshot_raw.json')); payload=j.get('payload', j); json.dump(payload, open('active_snapshot.json','w'))"
          python3 -c "import json; j=json.load(open('active_snapshot.json')); print('active_snapshot keys:', list(j)[:5])"


      - name: Run POTA scoring pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 run_pota_refresh.py --active-json active_snapshot.json
