/* Top-right pane: spectrum+spots */
#pane-top{
  display:flex;
  min-height: 30vh;   /* ~30% of window height */
  position:relative;
}

/* Left section (spectrum+waterfall) */
.wf-wrap{
  position:relative;
  flex:1;
  min-width:0;
  background:#000;
  overflow:hidden;
}

/* Right section (spots list) */
#spotsSide{
  width:220px;
  flex:0 0 220px;
  background:#111;
  color:#eee;
  border-left:1px solid #222;
  display:flex;
  flex-direction:column;
}

#spotsSide .spotsHeader{
  position:sticky;
  top:0;
  background:#181818;
  padding:6px 8px;
  border-bottom:1px solid #222;
}

/* Spectrum bar (top) */
#specCanvas{
  position:absolute;
  left:0; right:0; top:0; 
  width:100%;
  height:100%;                        
  display:block;
  pointer-events:auto;
  background:linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0));
  z-index:6;
}


/* Waterfall starts *below* spectrum */
#wfCanvas, #ovCanvas{
  position:absolute;
  left:0; right:0; bottom:0;
  top: var(--specH);
  width:100%;
  display:block;
}

/* Tooltip and status */
#specTip{
  position:absolute;
  top: calc(var(--specH) + 2px);
  left:8px;
  background:rgba(0,0,0,.55);
  color:#eee;
  padding:3px 6px;
  border-radius:6px;
  font:12px system-ui;
  z-index:5;
}
#wfStatus{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,.55);
  color:#eee;
  padding:4px 8px;
  border-radius:6px;
  font:12px system-ui;
  z-index:5;
}

/* Optional cosmetic tweaks */
#spotsList{
  list-style:none;
  margin:0;
  padding:0;
  overflow:auto;
  flex:1;
}

/* NEW: Spectrum full width and fixed height */
#spectrumContainer {
    width: 100%;
    height: 30vh;          /* top area = 30% of viewport height */
    min-height: 200px;     /* prevent collapsing on small windows */
    position: relative;
}

/* Ensures canvas fills the container and is NOT distorted 
#specCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* New bottom 3-column layout */
#threeColRow {
    display: flex;
    gap: 12px;
    height: calc(70vh - 24px);  /* remaining height after spectrum */
}

/* Bottom-right split: logging (left) + settings (right) */
.bottom-split{
  position: absolute; inset:0; padding:10px; display:grid; gap:14px;
  grid-template-columns: 1.4fr 0.6fr; /* logging smaller, settings column appears */
  overflow:auto;
}
@media (max-width: 980px){
  .bottom-split{ grid-template-columns: 1fr; }
}
.settings-card{
  background: #101522; border: 1px solid #20283a; border-radius: 14px; padding: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.settings-card h3{ margin: 0 0 10px 0; font-size: 14px; color:#cfd6e4; }
.settings-row{ display:flex; align-items:center; gap:10px; margin:10px 0; }
.settings-row label{ margin:0; color:#cfd6e4; font-size:13px; }
.settings-hint{ color:#9aa3b2; font-size:12px; margin-left:28px; }


/* --- Settings checkbox: text-sized and aligned --- */
.settings-row{
  display:flex; align-items:center; gap:10px; margin:10px 0;
}
.settings-row input[type="checkbox"]{
  /* make it roughly the same size as text */
  inline-size: 1em;
  block-size: 1em;
  margin: 0;
  vertical-align: middle;
  /* modern browsers: allows tint; remove if you don't want it */
  accent-color: #5f78ff;
}
.settings-row label{ margin:0; color:#cfd6e4; font-size:13px; line-height:1.2; }

/* --- Logger layout: Callsign on its own top line; QRZ dropdown at right --- */
#qsoForm *{ box-sizing: border-box; }

/* top row: callsign + qrz dropdown area */
#qsoForm .cs-row{
  display:grid;
  grid-template-columns: 1fr minmax(200px, 280px); /* input grows, dropdown area fixed-ish */
  gap: 12px;
  align-items: start;
  margin-bottom: 12px;
}

/* callsign cell */
#qsoForm .cs-cell label{
  display:block; font-size:16px; color:#9aa3b2; margin-bottom:6px;
}
#qsoForm #cs.fld{ width:150px; }

/* right-hand QRZ dropdown cell */
#qsoForm .qrz-cell{
  /* acts as a holder so the dropdown stays right of callsign */
  min-height: 38px;  /* matches input height visually */
  position: relative;
}
#qsoForm .qrz-cell .suggest-box{
  display:none;         /* your JS will toggle this */
  position: relative;   /* keep it inside this cell */
  max-height: 150px; overflow:auto;
  background:#0f1320; border:1px solid #2026373a; border-radius:10px;
}

/* grid for the remaining fields (wrap to next lines) */
#qsoForm .grid{
  display:grid; gap:10px;
  grid-template-columns: repeat(5, minmax(120px, 1fr));
  align-items:end;
}
@media (max-width: 1200px){
  #qsoForm .grid{ grid-template-columns: repeat(3, minmax(140px,1fr)); }
}
@media (max-width: 720px){
  #qsoForm .grid{ grid-template-columns: 1fr 1fr; }
}

/* field + buttons styling keeps your existing look */
#qsoForm label{ display:block; font-size:16px; color:#9aa3b2; margin-bottom:6px; }
#qsoForm .fld{
  background:#0f1320; border:1px solid #202637; border-radius:10px; padding:10px 12px; color:#e9edf1; outline:none; width:100%;
}
#qsoForm .fld:focus{ border-color:#3454ff; box-shadow:0 0 0 2px rgba(52,84,255,.15); }
#qsoForm .row{ display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
#qsoForm .btn{
  border:1px solid #2e3750; background:linear-gradient(180deg,#111827,#0d1421);
  color:#e9edf1; padding:10px 16px; border-radius:999px; cursor:pointer; font-weight:600;
}
#qsoForm .btn.primary{ border-color:#2e64ff; background:linear-gradient(180deg,#0f2a7a,#0b1d56); }

/* =====================================================
   ABSOLUTE MOBILE FIX — restores scrolling & layout
   ===================================================== */
@media (max-width: 768px) {

  input,
  select,
  textarea {
    font-size: 16px !important;  /* prevents Safari zoom */
  }

/* FORCE QSO FIRST */
  #centerColumn {
    order: 1 !important;
  }

  /* FORCE POTA SECOND */
  #potapage {
    order: 2 !important;
  }


  /* override scroll lock */
  html, body {
    height: auto !important;
    overflow: auto !important;
    position: static !important;
  }

  /* override the fixed-position full-screen app container */
  .wrap {
    position: static !important;
    display: block !important;
    height: auto !important;
    width: 100% !important;
    overflow: visible !important;
    padding: 12px !important;
  }

/* 👉 Make threeColRow a vertical flex so order works */
  #threeColRow {
    display: flex !important;
    flex-direction: column !important;
    height: auto !important;
    flex: none !important;
    overflow: visible !important;
    width: 100% !important;
  }

  #centerColumn {
    display: block !important;
    order: 1 !important;
    width: 100% !important;
  }

  #logger-bottom {
    display: block !important;
    flex: none !important;
    overflow: visible !important;
    width: 100% !important;
    height: auto !important;
    margin-bottom: 20px !important;
  }

/* POTA panel sizing on mobile */
#potapage {
    display: block !important;
    order: 2 !important;
    width: 100% !important;

    /* Let it grow naturally */
    height: auto !important;
    min-height: 60vh !important;

    margin-top: 0 !important;
    margin-bottom: 80px !important;
}

#iframe-pota {
    width: 100% !important;
    height: 100% !important;
    min-height: 60vh !important;
}


  /* hide desktop-only sections */
  #pane-spots,
  #logger-top,
  #spectrumContainer {
    display: none !important;
  }

  /* mobile tab bar */
  #mobileTabBar {
    display: flex !important;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 54px;
    background: #111a;
    z-index: 999999;

}

// ========= Static schematic spectrum =========
function drawStaticSpectrum(){
  if (!SPEC) return;

  const rect = SPEC.getBoundingClientRect();
  const w = rect.width  || 1;
  const h = rect.height || 140;     // use actual CSS height

  // Zone layout: top for labels, bottom for band
  const labelZoneFrac = 0.35;       // 35% of height for labels
  const labelZoneH    = h * labelZoneFrac;
  const bandH         = h - labelZoneH;   // 65% for band + bars
  const bandTop       = labelZoneH;       // band starts below label zone

  const labelRows = [];  // used to stagger text

  // Clear & draw band background
  spc.clearRect(0, 0, w, h);

  spc.fillStyle = '#000000ff';
  spc.fillRect(0, bandTop, w, bandH);
  spc.strokeStyle = '#ae2960ff';
  spc.lineWidth   = 2;
  spc.strokeRect(0, bandTop, w, bandH);

  // =====================================================
//  TICK MARKS ALONG SPECTRUM  (edit tickKHz to adjust)
// =====================================================
const tickKHz = 10;
const half    = getHalfSpanHz();
const leftHz  = getViewCenterHz() - half;
const rightHz = getViewCenterHz() + half;

const firstTickHz = Math.ceil(leftHz / (tickKHz * 1000)) * (tickKHz * 1000);

spc.strokeStyle = "#556070";
spc.fillStyle   = "#8890a0";
spc.lineWidth   = 1;
spc.font        = "10px sans-serif";
spc.textAlign   = "center";
spc.textBaseline= "bottom";


for (let f = firstTickHz; f <= rightHz; f += tickKHz * 1000) {
  const x = xForFreq(f);

    // tiny vertical tick line
    spc.beginPath();
    spc.moveTo(x, bandTop);
    spc.lineTo(x, bandTop +100);
    spc.stroke();

    // label above band
    const label = (f/1000).toFixed(1);
    spc.fillText(label, x, bandTop + 30);
}
// =====================================================
//   CENTER TUNING LINE (vertical indicator at centerHz)
// =====================================================
const centerX = xForFreq(getViewCenterHz());
spc.strokeStyle = "#a0b0ff";   // soft blue
spc.lineWidth = 0.5;

spc.beginPath();
spc.moveTo(centerX, 0);
spc.lineTo(centerX, h);
spc.stroke();


  const modeFilter = getModeFilter();

  (rawSpots || []).forEach(s => {
    const modeOK = !modeFilter || (s.mode || '').toUpperCase() === modeFilter;
    if (!modeOK) return;

    const fHz = Number(s.freq) || Number(s.freq_hz) || 0;
    if (!fHz) return;

    const x = xForFreq(fHz);
    if (x < 0 || x > w) return;

    const snr  = (typeof s.snr === 'number') ? s.snr : 10;
    const barH = Math.min(60, Math.max(12, snr * 3));
    const barW = 8;

    // Bars anchored in the band area
    const barBottom = bandTop + bandH;          // bottom of band
    const y         = barBottom - barH;         // top of bar

    // Bar color
    let col =
      snr > 25 ? '#fff799' :
      snr > 18 ? '#ffe066' :
      snr > 12 ? '#ffd24d' :
                 '#ccb86a';

    spc.fillStyle = col;
    spc.fillRect(x - barW/2, y, barW, barH);

    

    // ====== LABEL OVERLAY WITH STAGGER ======
    // Text color based on SNR
    let txtColor = '#dfe7ff';
    if (snr > 25) txtColor = '#fff8b3';
    else if (snr > 18) txtColor = '#ffe89a';

    spc.textAlign = 'center';
    spc.textBaseline = 'bottom';
    spc.fillStyle = txtColor;

    // Callsign text (shortened)
    let cs = (s.callsign || '').trim();
    if (cs.length > 7) cs = cs.slice(0, 6) + '…';

    // Choose a label row that doesn't collide horizontally
    let row = 0;
    const MIN_HORIZONTAL_SEP = 20;
    while (
      labelRows[row] &&
      labelRows[row].some(px => Math.abs(px - x) < MIN_HORIZONTAL_SEP)
    ){
      row++;
    }
    if (!labelRows[row]) labelRows[row] = [];
    labelRows[row].push(x);

    // Label base Y: somewhere in label zone, above bandTop
    const baseLabelY = bandTop - 4;           // just above band
    const textY      = baseLabelY - row * 14; // stagger upward

    // Draw callsign
    spc.font = '8px sans-serif';
    spc.fillText(cs, x, textY);
    updateLicenseOverlay();

 /*    // Program tag (optional)

      spc.fillText(lbl, x, textY - 12);
    } */
  });

  // DEBUG (optional): comment out when happy
  // console.log("Canvas:", SPEC.width, SPEC.height, "CSS height:", h);
}


// --- General class privilege segments (Hz) ---
// Based on ARRL US Amateur Radio Bands chart. :contentReference[oaicite:1]{index=1}
// Notes:
// - This is "where General may transmit" within each HF band (common use).
// - 60m is channelized; this overlay uses the channel center windows.
// - VHF/UHF are generally "all privileges" (band-specific rules still apply).

const GENERAL_SEGMENTS = [
  // 160m: 1.800–2.000
  { start: 1.800e6, end: 2.000e6, label: "160m (Gen: all)" },

  // 80m/75m: Gen CW/data 3.525–3.600, Gen phone 3.800–4.000
  { start: 3.525e6, end: 3.600e6, label: "80m (Gen CW/data)" },
  { start: 3.800e6, end: 4.000e6, label: "75/80m (Gen phone)" },

  // 60m: channelized (USB + data), 2.8 kHz channels shown on ARRL chart
  // Centers (MHz): 5.3305, 5.3465, 5.3570, 5.3715, 5.4035
  ...[5.3305, 5.3465, 5.3570, 5.3715, 5.4035].map(mhz => {
    const c = mhz * 1e6;
    return { start: c - 1.4e3, end: c + 1.4e3, label: `60m ch @ ${mhz} MHz (Gen)` };
  }),

  // 40m: Gen CW/data 7.025–7.125, Gen phone 7.175–7.300
  { start: 7.025e6, end: 7.125e6, label: "40m (Gen CW/data)" },

  { start: 10.100e6, end: 10.150e6, label: "30m (Gen CW/data)" },

  { start: 14.025e6, end: 14.150e6, label: "20m (Gen CW/data)" },

  // 17m: 18.068–18.168
  { start: 18.068e6, end: 18.168e6, label: "17m (Gen CW/data/phone)" },

  // 15m: Gen CW/data 21.025–21.200, Gen phone 21.275–21.450
  { start: 21.025e6, end: 21.200e6, label: "15m (Gen CW/data)" },

  { start: 24.890e6, end: 24.990e6, label: "12m (Gen CW/data/phone)" },

  // 10m: 28.000–29.700 (Gen has broad phone above ~28.300 per chart)
  { start: 28.000e6, end: 29.700e6, label: "10m (Gen)" },

  // 6m: 50–54 (Gen: all)
  { start: 50.000e6, end: 54.000e6, label: "6m (Gen: all)" },

  // 2m: 144–148 (Gen: all)
  { start: 144.000e6, end: 148.000e6, label: "2m (Gen: all)" },
];

function updateLicenseOverlay() {
  window.updateLicenseOverlay = updateLicenseOverlay;
  const overlay = document.getElementById("licenseOverlay");
  if (!overlay) return;

  const centerHz = Number(getViewCenterHz());
  const half = getHalfSpanHz();

  const minHz = centerHz - half;
  const maxHz = centerHz + half;
  const widthHz = maxHz - minHz;

  const visible = GENERAL_SEGMENTS.filter(s => s.end > minHz && s.start < maxHz);

  overlay.innerHTML = visible.map(s => {
    const leftPct  = ((Math.max(s.start, minHz) - minHz) / widthHz) * 100;
    const rightPct = ((Math.min(s.end, maxHz)   - minHz) / widthHz) * 100;
    const wPct = Math.max(0, rightPct - leftPct);
    /* return `<div class="license-seg" style="left:${leftPct}%; width:${wPct}%;"></div>`; */
    return `<div
  style="
    position:absolute;
    top:0;
    left:${leftPct}%;
    width:${wPct}%;
    height:100%;
    background:rgba(46,204,113,0.28);
    outline:2px solid rgba(46,204,113,0.55);
    z-index:9999;
    pointer-events:none;
  "
></div>`;

  }).join("");
}

// QRS LOOKUP WITH DROP DOWN--- Config: point this to your existing QRZ search endpoint ---
// Expect it to return: [{ call: "W5AL", name: "Roger Barkley" }, ...]
 // --- endpoints (top of file) ---




/* const QRZ_LOOKUP_ENDPOINT  = `${API}/qrz/lookup`; // existing */
const QRZ_SUGGEST_ENDPOINT = `${API}/suggest`;      // your proxy route



function debounce(fn, delay=200) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
}



class CallsignAutocomplete {
  constructor(inputEl, listEl, opts = {}) {
    this.input = inputEl;
    this.list = listEl;
    this.minChars = opts.minChars ?? 2;
    this.maxResults = opts.maxResults ?? 12;
    this.items = [];
    this.activeIndex = -1;
    this.ctrl = null;

    // ARIA base
    this.input.setAttribute('role', 'combobox');
    this.input.setAttribute('aria-autocomplete', 'list');
    this.input.setAttribute('aria-expanded', 'false');
    this.list.setAttribute('role', 'listbox');

    // Wire events
    this.input.addEventListener('input', () => this.onInput());
    this.input.addEventListener('keydown', (e) => this.onKeyDown(e));
    document.addEventListener('click', (e) => {
      if (!this.list.contains(e.target) && e.target !== this.input) this.hide();
    });
  }

  async onInput() {
    const q = this.input.value.trim().toUpperCase();
    if (q.length < this.minChars) { this.hide(); return; }

    // cancel prior request
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = new AbortController();

    try {
      const url = `${API}/api/qrz/lookup?call=${q}`;
  /*     const url = new URL('/api/qrz/lookup', window.location.origin); */
  /*     url.searchParams.set('call', q); */
    /*   url.searchParams.set('limit', this.maxResults); */

      const res = await fetch(url.toString(), {
        headers: { "Accept": "application/json" },
        cache: 'no-store',
        signal: this.ctrl.signal
      });
      if (!res.ok) throw new Error(`Suggest failed: ${res.status}`);

        const data = await res.json();

      // Backend returns a single object, so wrap it into an array:
      const arr = Array.isArray(data) ? data : [data];

      // Map into autocomplete items
      const items = arr.map(r => ({
        call: r.call || r.CALL || r.callsign || "",
        name: r.name || r.NAME || r.fullname || r.op || "",
        state: r.state || r.STATE || r.us_state || ""
      })).filter(r => r.call);

      const refined = items
        .filter(r => r.call.startsWith(q))
        .slice(0, this.maxResults);

      this.render(refined);
    } catch (err) {
      if (err.name !== 'AbortError') console.error(err);
      /* this.hide(); */
    }
  }

  render(items) {
    this.items = items;
    this.activeIndex = -1;
    this.list.innerHTML = "";
    if (!items.length) { this.hide(); return; }

    items.forEach((it, idx) => {
      const div = document.createElement('div');
      div.className = 'ac-item';
      div.setAttribute('role', 'option');
      div.setAttribute('id', `ac-opt-${idx}`);
      div.innerHTML =
        `<span class="ac-call">${it.name}</span><span class="ac-name">${it.state || ""}</span>`;
      // mousedown avoids blur-before-click
      div.addEventListener('mousedown', (e) => {
        e.preventDefault();
        this.select(idx);
      });
      this.list.appendChild(div);
    });

    this.list.style.display = 'block';
    this.input.setAttribute('aria-expanded', 'true');
    this.input.setAttribute('aria-controls', this.list.id);
  }

  onKeyDown(e) {
    if (this.list.style.display !== 'block') return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      this.move(1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      this.move(-1);
    } else if (e.key === 'Enter') {
      if (this.activeIndex >= 0) {
        e.preventDefault();
        this.select(this.activeIndex);
      }
    } else if (e.key === 'Escape') {
      this.hide();
    }
  }

  move(delta) {
    const count = this.items.length;
    if (!count) return;
    this.activeIndex = (this.activeIndex + delta + count) % count;
    [...this.list.children].forEach((el, i) => {
      el.setAttribute('aria-selected', i === this.activeIndex ? 'true' : 'false');
      if (i === this.activeIndex) el.scrollIntoView({ block: 'nearest' });
    });
  }

  async select(index) {
    const item = this.items[index];
    if (!item) return;

    this.input.value = item.call;
    this.hide();

    try {
      const r = await fetch(
        `${QRZ_LOOKUP_ENDPOINT}?call=${encodeURIComponent(item.call)}`,
        { cache: 'no-store' }
      );
      if (!r.ok) throw new Error('QRZ lookup failed');
      const detail = await r.json();

      this.input.dispatchEvent(new CustomEvent('callsignSelected', {
        bubbles: true,
        detail: {
          call: item.call,
          name: item.name || detail.name || detail.NAME || "",
          state: item.state || detail.state || detail.STATE || "",
          raw: detail
        }
      }));
    } catch (e) {
      console.error(e);
      this.input.dispatchEvent(new CustomEvent('callsignSelected', {
        bubbles: true,
        detail: { call: item.call, name: item.name || "", state: item.state || "" }
      }));
    }
  }

  hide() {
    this.list.style.display = 'none';
    this.input.setAttribute('aria-expanded', 'false');
    this.list.innerHTML = '';
    this.items = [];
    this.activeIndex = -1;
  }
}

  let lines = txt.split('\n').map(l => l.trim()).filter(l => l && l !== "Hunter");

  // Parse each line into fields
  let qsos = [];
  for (let line of lines) {
    // Skip header lines
    if (line.toLowerCase().startsWith("date") || line.toLowerCase().startsWith("hunter")) continue;

    // Defensive: Only process if at least 7 fields (date, activator, operator, ... etc)

  const tagRows = () => {
    UL.querySelectorAll('li').forEach(li => {
      const a = li.querySelector('a.spot-recenter');
      const f = Number(a?.dataset.freq);
      if (Number.isFinite(f) && f > 0) li.dataset.freq = String(Math.round(f));
    });
  };

  // Run now for current content, and observe for future re-renders.
  tagRows();
  const mo = new MutationObserver(tagRows);
  mo.observe(UL, { childList:true, subtree:true });
})();
</script>

<script>
// ---- Settings state & persistence ----
(function(){
  const KEY = 'ham3panel-settings-v1';
  const defaults = { mhzClickTunes: true };

  function load(){
    try { return Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY)||'{}')); }
    catch { return { ...defaults }; }
  }
  function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

  // expose minimal global for other modules to check
  window.HAM = window.HAM || {};
  const state = window.HAM.settings = load();

  // init checkbox UI
  const cb = document.getElementById('set_mhz_tunes');
  if (cb){
    cb.checked = !!state.mhzClickTunes;
    cb.addEventListener('change', ()=>{
      state.mhzClickTunes = !!cb.checked;
      save(state);
    });
  }

  // Patch the Spots MHz click so it can optionally tune
  // Find the existing MHz click hook and augment it safely:
  const UL = document.getElementById('spotsList');

  // Delegate: watch for .spot-mhz clicks
  if (UL){
    UL.addEventListener('click', (e)=>{
      const el = e.target.closest('.spot-mhz');
      if (!el) return;              // not a MHz click
      // existing behavior: recenter view (already handled where you add the listener)
      // we keep that behavior; we only add optional tune below:
      if (!window.HAM?.settings?.mhzClickTunes) return;

      const f = Number(el.dataset.freq);
      if (Number.isFinite(f) && f > 0){
        fetch(`${API}/rig/tune`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ freq_hz: Math.round(f) })
        }).catch(()=>{});
      }
    }, true); // capture so we run even if other handlers stop propagation
  }
})();

(function() {
  const path = location.pathname;
  const tabs = document.querySelectorAll("#mobileTabBar .tab");

  tabs.forEach(tab => {
    const href = tab.getAttribute("href");
    if (path.endsWith(href)) {
      tab.classList.add("active");
    }
  });
})();
</script>

<!-- Mobile Tab Bar -->
<div id="mobileTabBar">
  <a href="#" class="tab" data-tab="qso">QSO</a>
  <a href="#" class="tab" data-tab="pota">POTA</a>
</div>

<!-- Mobile Tab Scroll Logic -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const cb = document.getElementById("set_mhz_tunes");
      if (!cb) return;

      // Default ON unless a saved value explicitly says otherwise
      const saved = localStorage.getItem("set_mhz_tunes");
      cb.checked = (saved === null) ? true : (saved === "true");

      cb.addEventListener("change", () => {
        localStorage.setItem("set_mhz_tunes", String(cb.checked));
      });



  // Finds nearest scrollable parent
  function getScrollParent(el) {
    let parent = el.parentNode;
    while (parent && parent !== document.body) {
      const style = getComputedStyle(parent);
      const overflowY = style.overflowY;
      if (overflowY === "auto" || overflowY === "scroll") return parent;
      parent = parent.parentNode;
    }
    return window; // fallback
  }

  function scrollToId(id) {
    const target = document.getElementById(id);
    if (!target) return console.warn("Scroll target not found:", id);

    const parent = getScrollParent(target);

    parent.scrollTo({
      top: target.offsetTop,
      behavior: "smooth"
    });
  }

  // Bind buttons
  document.querySelector('[data-tab="qso"]')?.addEventListener("click", (e) => {
    e.preventDefault();
    scrollToId("logger-bottom");
  });

  document.querySelector('[data-tab="pota"]')?.addEventListener("click", (e) => {
    e.preventDefault();
    scrollToId("potapage");
  });
});
</script>
